<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>顧客一覧</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">顧客一覧</h1>

    <table class="table table-striped">
      <thead class="thead-dark">
        <tr>
          <th>#</th>
          <th>会社名</th>
          <th>業種</th>
          <th>連絡先</th>
          <th>所在地</th>
        </tr>
      </thead>
      <tbody id="customer-list">
      </tbody>
    </table>
  </div>

  <script type="module">
    import config from '../config.js';

    fetch(`${config.apiUrl}/customers`)
      .then(response => response.json())
      .then(data => {
        const list = document.getElementById('customer-list');

        data.forEach((customer, index) => {
          const row = list.insertRow();

          row.insertCell(0).textContent = index + 1;
          row.insertCell(1).textContent = customer.company_name;
          row.insertCell(2).textContent = customer.industry;
          row.insertCell(3).textContent = customer.contact;
          row.insertCell(4).textContent = customer.location;
        });
      })
      .catch(error => {
        console.error('Error:', error);
        alert('顧客一覧の取得に失敗しました。');
      });
  </script>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
